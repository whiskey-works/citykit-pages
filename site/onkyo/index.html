<style>
:root {
  --paper: #f1eee8;        /* the phone map's land colour */
  --ground: #f6f4ef;
  --panel: #ffffff;
  --ink: #1e2024;
  --muted: #676a71;
  --rule: #dcd7cc;
  --loop: #2e8b57;         /* Nyamanote Line */
  --chuon: #d9621a;        /* Chūon Line */
  --pin: #1e2024;
  --pin-ink: #ffffff;
  --shadow: 0 1px 2px rgba(30, 32, 36, .08), 0 8px 24px rgba(30, 32, 36, .08);
  --display: "Bricolage Grotesque", "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  --body: "IBM Plex Sans", "Hiragino Sans", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground: #121417; --panel: #1b1e22; --ink: #ecebe6; --muted: #9a9ea6; --rule: #2e3238;
    --loop: #52c285; --chuon: #f08a44; --pin: #ecebe6; --pin-ink: #121417;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground: #121417; --panel: #1b1e22; --ink: #ecebe6; --muted: #9a9ea6; --rule: #2e3238;
  --loop: #52c285; --chuon: #f08a44; --pin: #ecebe6; --pin-ink: #121417;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35);
}
* { box-sizing: border-box; }
body { background: var(--ground); color: var(--ink); font: 15px/1.55 var(--body); margin: 0; }
.wrap { max-width: 1240px; margin: 0 auto; padding-inline: 20px; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; }
.eyebrow { font: 500 11px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.ja { font-family: "Zen Kaku Gothic New", "Hiragino Sans", sans-serif; font-weight: 500; color: var(--muted); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--loop); outline-offset: 2px; }

/* hero: the city at night, with the name set over it */
.hero { position: relative; margin-top: 16px; border-radius: 14px; overflow: hidden; background: #0d0f14; aspect-ratio: 21 / 8; max-height: 460px; width: 100%; }
.hero img { width: 100%; height: 100%; object-fit: cover; display: block; }
.hero .over { position: absolute; inset: auto 0 0 0; padding: 28px 28px 24px; color: #f4f2ec;
  background: linear-gradient(to top, rgba(8, 10, 14, .82), rgba(8, 10, 14, 0)); }
.hero h1 { font-size: clamp(34px, 6vw, 68px); font-weight: 800; letter-spacing: -.01em; line-height: 1; display: flex; align-items: baseline; gap: .35em; flex-wrap: wrap; }
.hero h1 .ja { color: rgba(244, 242, 236, .7); font-size: .5em; font-weight: 700; }
.hero p { margin: 10px 0 0; max-width: 60ch; color: rgba(244, 242, 236, .86); font-size: 16px; }
.hero .gloss { font-style: italic; color: rgba(244, 242, 236, .7); font-size: 14px; margin-top: 4px; }

.facts { display: flex; flex-wrap: wrap; gap: 8px 28px; padding: 16px 2px 0; font: 13px/1.4 var(--mono); color: var(--muted); }
.facts b { color: var(--ink); font-weight: 500; font-variant-numeric: tabular-nums; }
.lines { display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 10px 2px 0; font-size: 13px; color: var(--muted); }
.lines span { display: inline-flex; align-items: center; gap: 6px; }
.lines i { width: 18px; height: 4px; border-radius: 2px; display: inline-block; }

/* the map and its side panel */
section { padding-block: 44px 0; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
.sec-head h2 { font-size: 26px; font-weight: 700; }
.sec-head p { margin: 4px 0 0; color: var(--muted); max-width: 62ch; }
.atlas { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 0; border: 1px solid var(--rule); border-radius: 14px; overflow: hidden; background: var(--panel); box-shadow: var(--shadow); }
.mapbox { position: relative; height: min(72vh, 720px); min-height: 440px; background: var(--paper); }
#map { position: absolute; inset: 0; }
.hud { position: absolute; left: 10px; bottom: 10px; z-index: 2; background: rgba(255, 255, 255, .92); color: #26262c; border-radius: 8px; padding: 4px 8px; font: 11.5px/1.3 var(--mono); pointer-events: none; font-variant-numeric: tabular-nums; }
.scale { position: absolute; right: 10px; bottom: 10px; z-index: 2; font: 11px var(--mono); color: #26262c; text-align: right; pointer-events: none; }
.scale .bar { height: 6px; border: 2px solid #26262c; border-top: none; margin-top: 2px; background: rgba(255, 255, 255, .7); }
.findbox { position: absolute; top: 10px; right: 10px; left: 56px; z-index: 2; display: flex; justify-content: flex-end; }
.findbox input { width: min(300px, 100%); font: 14px var(--body); color: #1e2024; background: #fff; border: 1px solid #cfc9bd; border-radius: 999px; padding: 8px 14px; box-shadow: 0 2px 8px rgba(0, 0, 0, .12); }
.home-btn { position: absolute; top: 84px; left: 10px; z-index: 2; background: #fff; color: #333; border: 0; border-radius: 4px; box-shadow: 0 0 0 2px rgba(0, 0, 0, .1); width: 29px; height: 29px; cursor: pointer; font-size: 15px; line-height: 1; }

.pin { display: flex; align-items: center; gap: 6px; cursor: pointer; transform: translateY(-2px); }
.pin .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--loop); border: 3px solid #fff; box-shadow: 0 1px 4px rgba(0, 0, 0, .35); flex: none; }
.pin .tag { font: 600 12px/1 var(--body); background: #fff; color: #1e2024; padding: 5px 8px; border-radius: 999px; box-shadow: 0 1px 4px rgba(0, 0, 0, .25); white-space: nowrap; }
.pin.on .dot { background: var(--chuon); width: 18px; height: 18px; }
.pin.on .tag { background: #1e2024; color: #fff; }
.pin.far .tag { display: none; }

.side { border-left: 1px solid var(--rule); display: flex; flex-direction: column; min-height: 0; height: min(72vh, 720px); min-height: 440px; }
.side .list { overflow-y: auto; padding: 6px; }
.side .item { display: grid; grid-template-columns: 64px 1fr; gap: 10px; align-items: center; padding: 8px; border-radius: 10px; border: 0; background: none; text-align: left; cursor: pointer; width: 100%; }
.side .item:hover { background: var(--ground); }
.side .item.on { background: var(--ground); box-shadow: inset 3px 0 0 var(--chuon); }
.side .item img { width: 64px; height: 44px; object-fit: cover; border-radius: 6px; display: block; background: var(--rule); }
.side .item b { font: 700 14px/1.2 var(--display); display: block; }
.side .item small { color: var(--muted); font-size: 12px; }
.card { padding: 14px 16px 16px; border-bottom: 1px solid var(--rule); }
.card[hidden] { display: none; }
.card .shot { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 8px; display: block; cursor: zoom-in; background: var(--rule); }
.card h3 { font-size: 20px; font-weight: 800; margin-top: 12px; }
.card .ja { font-size: 14px; margin-left: 6px; }
.card .gloss { font-style: italic; color: var(--muted); font-size: 13px; margin: 2px 0 8px; }
.card p { margin: 0; font-size: 14px; }
.card .row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.chip { font: 500 12px var(--body); border: 1px solid var(--rule); background: var(--panel); border-radius: 999px; padding: 5px 11px; cursor: pointer; }
.chip:hover { border-color: var(--ink); }
.coords { font: 11.5px var(--mono); color: var(--muted); margin-top: 8px; }

/* places: one block per highlight, a strip of renders */
.place { padding-block: 26px; border-top: 1px solid var(--rule); display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 24px; }
.place:first-of-type { border-top: 0; }
.place h3 { font-size: 24px; font-weight: 800; line-height: 1.15; }
.place .ja { display: block; font-size: 15px; margin-top: 4px; }
.place .gloss { font-style: italic; color: var(--muted); font-size: 13.5px; margin: 8px 0; }
.place p { margin: 0; }
.place .meta { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.kind { font: 500 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.strip { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(260px, 38%); gap: 12px; overflow-x: auto; padding-bottom: 8px; scroll-snap-type: x proximity; }
.strip figure { margin: 0; scroll-snap-align: start; }
.strip img { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; border-radius: 8px; display: block; cursor: zoom-in; background: var(--rule); }
.strip figcaption { font-size: 12.5px; color: var(--muted); margin-top: 6px; }

/* skylines: drag the horizon */
.sky { margin: 0 0 18px; }
.sky .pan { overflow-x: auto; border-radius: 10px; background: #0d0f14; cursor: grab; scrollbar-width: thin; }
.sky .pan.drag { cursor: grabbing; }
.sky .pan img { height: clamp(120px, 18vw, 200px); width: auto; max-width: none; display: block; user-select: none; -webkit-user-drag: none; }
.sky figcaption { font-size: 13px; color: var(--muted); margin-top: 6px; display: flex; justify-content: space-between; gap: 12px; }
.frames { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.frames figure { margin: 0; }
.frames img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 8px; display: block; cursor: zoom-in; }
.frames figcaption { font-size: 12.5px; color: var(--muted); margin-top: 6px; }

/* the kits */
.kits { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; border-top: 2px solid var(--ink); }
.kits div { padding: 14px 18px 4px 0; }
.kits div + div { padding-left: 18px; border-left: 1px solid var(--rule); }
.kits h3 { font-size: 17px; font-weight: 700; }
.kits code { font: 12px var(--mono); color: var(--muted); }
.kits p { font-size: 14px; margin: 8px 0 0; }
footer { padding-block: 48px 40px; color: var(--muted); font-size: 13px; }
footer code { font: 12.5px var(--mono); background: var(--panel); border: 1px solid var(--rule); padding: 2px 6px; border-radius: 4px; }

/* lightbox */
.lb[hidden], .card[hidden] { display: none !important; }
.lb { position: fixed; inset: 0; z-index: 50; background: rgba(8, 10, 14, .92); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px 16px; }
.lb img { max-width: 100%; max-height: calc(100% - 70px); border-radius: 8px; }
.lb .cap { color: #e6e4de; margin-top: 12px; font-size: 14px; text-align: center; }
.lb .cap span { color: #9a9ea6; font: 12px var(--mono); margin-left: 8px; }
.lb button { position: absolute; background: rgba(255, 255, 255, .12); color: #fff; border: 0; border-radius: 999px; width: 44px; height: 44px; font-size: 20px; cursor: pointer; }
.lb .x { top: calc(14px + env(safe-area-inset-top, 0px)); right: 14px; }
.lb .prev { left: 14px; top: 50%; }
.lb .next { right: 14px; top: 50%; }

@media (max-width: 900px) {
  .atlas { grid-template-columns: 1fr; }
  .side { border-left: 0; border-top: 1px solid var(--rule); height: auto; min-height: 0; }
  .side .list { max-height: 340px; }
  .mapbox { height: 62vh; min-height: 380px; }
  .place { grid-template-columns: 1fr; gap: 14px; }
  .strip { grid-auto-columns: minmax(240px, 78%); }
  .kits { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kits div:nth-child(3) { padding-left: 0; border-left: 0; }
  .hero { aspect-ratio: 4 / 3; }
}
@media (max-width: 520px) {
  .wrap { padding-inline: 16px; }
  .frames, .kits { grid-template-columns: 1fr; }
  .kits div, .kits div + div { padding-left: 0; border-left: 0; }
  .hero .over { padding: 18px; }
  .findbox { left: 48px; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }

/* statues: portrait cards on the stone renders' grey */
.statues { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 18px 14px; }
.statues figure { margin: 0; }
.statues img { width: 100%; aspect-ratio: 7 / 10; object-fit: cover; border-radius: 8px; display: block; cursor: zoom-in; background: #7d818a; }
.statues h3 { font-size: 16px; font-weight: 800; margin-top: 10px; }
.statues .stone { font: 500 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-top: 2px; }
.statues p { font-size: 13.5px; margin: 6px 0 8px; }
.statues .more { font: 12px var(--mono); color: var(--muted); }

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = (n) => Math.round(n).toLocaleString("en");

// ---- header
$("hero").innerHTML = `${D.hero ? `<img src="${D.hero.src}" alt="${esc(D.hero.alt || "")}">` : ""}
  <div class="over"><div class="eyebrow" style="color:rgba(244,242,236,.7)">${esc(D.text.eyebrow)}</div>
  <h1>${esc(D.title)} <span class="ja">${esc(D.city.ja)}</span></h1>
  <p>${esc(D.tagline)}</p><div class="gloss">${esc(D.city.gloss)}</div></div>`;
const st = D.stats;
$("facts").innerHTML = [["stations", st.stations], ["lines", st.lines], ["named places", st.places], ["built", st.set_pieces], ["renders here", st.renders], ["km map square", st.bounds_km]]
  .map(([k, v]) => `<span><b>${v}</b> ${k}</span>`).join("");
["mapBlurb", "placesBlurb", "kitBlurb", "statueBlurb"].forEach((k) => { $(k).textContent = D.text[k] || ""; });
$("foot").innerHTML = D.text.footer || "";
$("statueSec").hidden = !(D.statues || []).length; $("skySec").hidden = !(D.skylines.length || D.frames.length); $("kitSec").hidden = !D.kit.length;
$("lines").innerHTML = D.lines.map((l) => `<span><i style="background:${l.colour}"></i>${esc(l.name)}</span>`).join("");

// ---- lightbox
let lbSet = [], lbI = 0;
function openLB(set, i) { lbSet = set; lbI = i; showLB(); $("lb").hidden = false; $("lbX").focus(); }
function showLB() { const r = lbSet[lbI]; $("lbImg").src = r.src; $("lbImg").alt = r.caption; $("lbCap").innerHTML = `${esc(r.caption)}<span>${lbI + 1} / ${lbSet.length}</span>`; }
function stepLB(d) { lbI = (lbI + d + lbSet.length) % lbSet.length; showLB(); }
$("lbX").onclick = () => { $("lb").hidden = true; };
$("lbPrev").onclick = () => stepLB(-1); $("lbNext").onclick = () => stepLB(1);
$("lb").addEventListener("click", (e) => { if (e.target === $("lb")) $("lb").hidden = true; });
addEventListener("keydown", (e) => { if ($("lb").hidden) return; if (e.key === "Escape") $("lb").hidden = true; if (e.key === "ArrowLeft") stepLB(-1); if (e.key === "ArrowRight") stepLB(1); });

// ---- places
$("places").innerHTML = D.places.map((p) => `<article class="place" id="place-${p.id}">
  <div><div class="kind">${esc(p.kind)}</div><h3>${esc(p.name.romaji)}<span class="ja">${esc(p.name.ja)}</span></h3>
    ${p.name.gloss ? `<div class="gloss">${esc(p.name.gloss)}</div>` : ""}<p>${esc(p.blurb)}</p>
    <div class="meta"><button class="chip" data-show="${p.id}">Show on the map</button></div></div>
  <div class="strip">${p.renders.map((r, i) => `<figure><img loading="lazy" src="${r.src}" alt="${esc(r.caption)}" data-p="${p.id}" data-i="${i}"><figcaption>${esc(r.caption)}</figcaption></figure>`).join("")}</div>
</article>`).join("");
const byId = Object.fromEntries(D.places.map((p) => [p.id, p]));
document.addEventListener("click", (e) => {
  const img = e.target.closest("img[data-p]");
  if (img) openLB(byId[img.dataset.p].renders, +img.dataset.i);
  const show = e.target.closest("[data-show]");
  if (show) { select(show.dataset.show, true); $("map-section").scrollIntoView({ behavior: "smooth" }); }
});

// ---- skylines: drag to pan
$("skylines").innerHTML = D.skylines.map((s, i) => `<figure class="sky"><div class="pan" id="pan${i}"><img src="${s.src}" alt="${esc(s.caption)}" draggable="false"></div>
  <figcaption><span>${esc(s.caption)}</span><span class="eyebrow">360° · drag</span></figcaption></figure>`).join("");
document.querySelectorAll(".pan").forEach((el) => {
  let x0 = null, s0 = 0;
  el.addEventListener("pointerdown", (e) => { if (e.pointerType !== "mouse") return; x0 = e.clientX; s0 = el.scrollLeft; el.classList.add("drag"); el.setPointerCapture(e.pointerId); });
  el.addEventListener("pointermove", (e) => { if (x0 !== null) el.scrollLeft = s0 - (e.clientX - x0); });
  const end = () => { x0 = null; el.classList.remove("drag"); };
  el.addEventListener("pointerup", end); el.addEventListener("pointercancel", end);
  const img = el.querySelector("img"); const centre = () => { el.scrollLeft = (el.scrollWidth - el.clientWidth) / 2; };
  img.complete ? centre() : img.addEventListener("load", centre);
});
$("frames").innerHTML = D.frames.map((f, i) => `<figure><img loading="lazy" src="${f.src}" alt="${esc(f.caption)}" data-frame="${i}"><figcaption>${esc(f.caption)}</figcaption></figure>`).join("");
$("frames").addEventListener("click", (e) => { const im = e.target.closest("img[data-frame]"); if (im) openLB(D.frames, +im.dataset.frame); });
$("statues").innerHTML = (D.statues || []).map((t, i) => `<figure><img loading="lazy" src="${t.images[0].src}" alt="${esc(t.name)}" data-statue="${i}">
  <h3>${esc(t.name)}</h3><div class="stone">${esc(t.stone)}${t.where ? " · " + esc(t.where) : ""}</div><p>${esc(t.blurb)}</p>
  ${t.place && byId[t.place] ? `<button class="chip" data-show="${t.place}">Show on the map</button>` : `<span class="more">${esc(t.status || "")}</span>`}</figure>`).join("");
$("statues").addEventListener("click", (e) => { const im = e.target.closest("img[data-statue]"); if (im) openLB(D.statues[+im.dataset.statue].images, 0); });
$("kits").innerHTML = D.kit.map((k) => `<div><h3>${esc(k.name)}</h3><code>${esc(k.path)}</code><p>${esc(k.does)}</p></div>`).join("");

// ---- side list
$("list").innerHTML = D.places.map((p) => `<button class="item" data-sel="${p.id}"><img src="${p.renders[0].src}" alt="" loading="lazy">
  <span><b>${esc(p.name.romaji)}</b><small>${p.name.ja ? esc(p.name.ja) + " · " : ""}${p.renders.length} ${p.renders.length === 1 ? "render" : "renders"}</small></span></button>`).join("");
$("list").addEventListener("click", (e) => { const b = e.target.closest("[data-sel]"); if (b) select(b.dataset.sel, true); });

// ---- the map. Zoom 0 of the tile pyramid is one tile covering size_m from origin_m (top-left). MapLibre is handed
// that square as the whole Web Mercator world, so the pyramid lines up with no reprojection; plan zoom z is map zoom z - 1.
const M = D.map, S = M.size_m, [ox, oy] = M.origin_m;
const toLL = ([x, y]) => { const u = (x - ox) / S, v = (oy - y) / S; return [u * 360 - 180, Math.atan(Math.sinh(Math.PI * (1 - 2 * v))) * 180 / Math.PI]; };
const toM = ({ lng, lat }) => { const r = lat * Math.PI / 180, v = (1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2; return [ox + (lng + 180) / 360 * S, oy - v * S]; };

let map = null, markers = {}, current = null;
function select(id, fly) {
  const p = byId[id]; if (!p) return;
  current = id;
  document.querySelectorAll(".item").forEach((b) => b.classList.toggle("on", b.dataset.sel === id));
  Object.entries(markers).forEach(([k, m]) => m.getElement().classList.toggle("on", k === id));
  const c = $("card"); c.hidden = false;
  c.innerHTML = `<img class="shot" src="${p.renders[0].src}" alt="${esc(p.renders[0].caption)}" data-p="${p.id}" data-i="0">
    <h3>${esc(p.name.romaji)}<span class="ja">${esc(p.name.ja)}</span></h3>${p.name.gloss ? `<div class="gloss">${esc(p.name.gloss)}</div>` : ""}
    <p>${esc(p.blurb)}</p><div class="row"><button class="chip" id="seeAll">All ${p.renders.length} renders</button><button class="chip" id="toPlace">Read more</button></div>
    <div class="coords">x ${fmt(p.pos[0])} m · y ${fmt(p.pos[1])} m</div>`;
  $("seeAll").onclick = () => openLB(p.renders, 0);
  $("toPlace").onclick = () => $("place-" + id).scrollIntoView({ behavior: "smooth" });
  if (fly && map) map.flyTo({ center: toLL(p.pos), zoom: p.zoom - 1, duration: 1100, essential: true });
}

(async function () {
  if (!window.maplibregl) { $("hud").textContent = "The map library didn't load."; return; }
  const index = (await (await fetch("tiles/index.json")).json()).tiles;
  const packs = {};
  const pack = (name) => packs[name] || (packs[name] = fetch("tiles/" + name).then((r) => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); }));
  maplibregl.addProtocol("citytile", async (params) => {
    const key = params.url.replace("citytile://", "");
    const e = index[key];
    if (!e) throw new Error("no tile " + key);
    const buf = await pack(e[0]);
    return { data: buf.slice(e[1], e[1] + e[2]) };
  });
  const home = D.home.at || [0, 0], homeZ = (D.home.zoom ?? 1.5) - 1;
  map = new maplibregl.Map({
    container: "map", attributionControl: false, renderWorldCopies: false, dragRotate: false, pitchWithRotate: false,
    center: toLL(home), zoom: homeZ, minZoom: Math.max(0, M.zooms[0] - 1), maxZoom: M.zooms[1] + 1.5,
    maxBounds: [[-179.99, -85.05], [179.99, 85.05]], cooperativeGestures: false,
    style: { version: 8, sources: { city: { type: "raster", tiles: ["citytile://{z}/{x}/{y}"], tileSize: M.tile_size, minzoom: M.zooms[0], maxzoom: M.zooms[1] } },
      layers: [{ id: "paper", type: "background", paint: { "background-color": "#f1eee8" } },
               { id: "city", type: "raster", source: "city", paint: { "raster-fade-duration": 120 } }] } });
  map.addControl(new maplibregl.NavigationControl({ showCompass: false }), "top-left");
  map.touchZoomRotate.disableRotation();

  for (const p of D.places) {
    const el = document.createElement("div"); el.className = "pin";
    el.innerHTML = `<span class="dot"></span><span class="tag">${esc(p.name.romaji)}</span>`;
    el.title = p.name.romaji;
    el.addEventListener("click", (e) => { e.stopPropagation(); select(p.id, true); });
    markers[p.id] = new maplibregl.Marker({ element: el, anchor: "left", offset: [-9, 0] }).setLngLat(toLL(p.pos)).addTo(map);
  }
  // labels collide when zoomed out: hide the tag of a pin that sits under an earlier one
  const declutter = () => {
    const boxes = [];
    for (const p of D.places) {
      const el = markers[p.id].getElement(), pt = map.project(toLL(p.pos));
      const w = 20 + p.name.romaji.length * 7, box = [pt.x, pt.y - 12, pt.x + w, pt.y + 12];
      const hit = boxes.some((b) => !(box[2] < b[0] || box[0] > b[2] || box[3] < b[1] || box[1] > b[3]));
      el.classList.toggle("far", hit && p.id !== current);
      if (!hit || p.id === current) boxes.push(box);
    }
  };
  map.on("move", declutter); map.on("load", declutter);

  $("home").onclick = () => map.flyTo({ center: toLL(home), zoom: homeZ, duration: 900 });
  const dl = $("finds"), label = (n) => `${n.romaji} ${n.ja}`.trim();
  D.find.forEach((f) => { const o = document.createElement("option"); o.value = label(f.name); dl.appendChild(o); });
  $("find").addEventListener("change", (e) => {
    const v = e.target.value.trim().toLowerCase();
    const f = D.find.find((f) => label(f.name).toLowerCase() === v || f.name.romaji.toLowerCase() === v || f.name.ja === e.target.value.trim());
    if (f) { map.flyTo({ center: toLL(f.pos), zoom: Math.max(map.getZoom(), f.zoom - 1), duration: 900 }); e.target.blur(); }
  });

  const hud = $("hud");
  const readout = (m) => { hud.textContent = `z ${(map.getZoom() + 1).toFixed(1)} · x ${fmt(m[0])} · y ${fmt(m[1])} m`; };
  map.on("mousemove", (e) => readout(toM(e.lngLat)));
  const scale = () => {
    const mpp = S / (512 * Math.pow(2, map.getZoom()));
    const target = mpp * 100, pow = Math.pow(10, Math.floor(Math.log10(target)));
    const nice = [1, 2, 5, 10].map((k) => k * pow).filter((v) => v <= target).pop() || pow;
    $("scaleBar").style.width = (nice / mpp) + "px";
    $("scaleLabel").textContent = nice >= 1000 ? `${nice / 1000} km` : `${nice} m`;
    readout(toM(map.getCenter()));
  };
  map.on("move", scale); scale();
})();
</script>
